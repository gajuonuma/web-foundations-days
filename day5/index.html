<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Load and filter users from an API.</p>
    </header>

    <main>
        <section>
            <h2>Users</h2>

            <button id="load-users" type="button">Load Users</button>

            <label for="filter-input">Filter users by name:</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Enter a name..."
            >

            <p id="status" role="status" aria-live="polite">Click "Load Users" to begin.</p>

            <ul id="users-list"></ul>
        </section>
    </main>
</body>
</html>
